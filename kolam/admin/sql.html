<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Salin SQL Kolam Koi</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{color-scheme:light dark}
body{margin:0;font:16px/1.5 system-ui,sans-serif;background:#eef1ec;color:#17221d}
@media (prefers-color-scheme:dark){body{background:#0e1512;color:#e6ece8}}
main{max-width:560px;margin:0 auto;padding:20px 16px;display:grid;gap:14px}
button{min-height:60px;border:none;border-radius:14px;background:#0e4d32;color:#fff;font:700 19px system-ui,sans-serif}
button:disabled{opacity:.5}
ol{margin:0;padding-left:20px}
textarea{width:100%;box-sizing:border-box;height:160px;font:12px ui-monospace,monospace;border-radius:10px;padding:8px}
#st{font-weight:600}
</style>
</head>
<body>
<main>
<h1 style="margin:0;font-size:22px">Salin SQL Kolam Koi</h1>
<button id="b" disabled>Memuat...</button>
<p id="st"></p>
<ol>
<li>Ketuk tombol hijau di atas.</li>
<li>Kembali ke Supabase → SQL Editor, hapus isi lama.</li>
<li>Tekan lama di area kosong → <b>Paste</b> → <b>Run</b>.</li>
</ol>
<p style="font-size:14px;opacity:.75">Kalau tombol tidak berhasil: ketuk kotak di bawah, pilih Select All, lalu Copy.</p>
<textarea id="t" readonly></textarea>
</main>
<script>
const b=document.getElementById("b"),t=document.getElementById("t"),st=document.getElementById("st");
fetch("../setup.sql",{cache:"no-store"}).then(r=>r.text()).then(s=>{t.value=s;b.disabled=false;b.textContent="Salin semua SQL"})
 .catch(()=>{b.textContent="Gagal memuat. Muat ulang halaman."});
b.onclick=async()=>{try{await navigator.clipboard.writeText(t.value)}catch(e){t.focus();t.select();document.execCommand("copy")}
 st.textContent="Tersalin ("+t.value.split("\n").length+" baris). Sekarang tempel di SQL Editor Supabase.";b.textContent="Tersalin ✓"};
</script>
</body>
</html>
